repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: secret-scan
        name: GEPASE secret and private-corpus scan
        entry: uv run python scripts/check_secrets.py
        language: system
        pass_filenames: false

