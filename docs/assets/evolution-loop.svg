<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">GEPASE end-to-end engineering pipeline</title>
  <desc id="desc">A three-plane diagram: isolated Agent roles execute work, the GEPASE Core compiles packages and controls evaluation and evolution, and an immutable evidence layer makes the entire run resumable and auditable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f4f7fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#334155" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#64748b"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#8b5cf6"/></marker>
    <style>
      .title{font:800 30px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .subtitle{font:500 15px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .lane-title{font:750 17px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .lane-sub{font:500 12px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .card-title{font:750 14px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .card-sub{font:500 11px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .number{font:800 12px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}
      .pill{font:650 12px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .line{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;marker-end:url(#arrow)}
      .loop{fill:none;stroke:#8b5cf6;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:7 7;marker-end:url(#arrow-purple)}
      .lane{rx:22;stroke-width:1.5}
      .card{fill:#fff;stroke:#d8dee9;stroke-width:1.3;rx:16;filter:url(#shadow)}
    </style>
  </defs>

  <rect width="1440" height="720" rx="30" fill="url(#bg)"/>
  <text x="62" y="58" class="title">One mainline, three responsibility planes</text>
  <text x="62" y="86" class="subtitle">Agent roles produce evidence; the Core owns state transitions; content-addressed artifacts make every decision reproducible.</text>

  <rect x="54" y="116" width="1332" height="116" class="lane" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="80" y="151" class="lane-title">Agent host · isolated execution plane</text>
  <text x="80" y="176" class="lane-sub">Typed WorkItems in; validated submissions out.</text>
  <text x="80" y="199" class="lane-sub">Contexts stay isolated; no role owns acceptance.</text>
  <g transform="translate(548 158)">
    <rect width="104" height="36" rx="18" fill="#fff" stroke="#fdba74"/><text x="52" y="23" text-anchor="middle" class="pill">Executor</text>
    <rect x="116" width="104" height="36" rx="18" fill="#fff" stroke="#fdba74"/><text x="168" y="23" text-anchor="middle" class="pill">Grader</text>
    <rect x="232" width="110" height="36" rx="18" fill="#fff" stroke="#fdba74"/><text x="287" y="23" text-anchor="middle" class="pill">Comparator</text>
    <rect x="354" width="104" height="36" rx="18" fill="#fff" stroke="#fdba74"/><text x="406" y="23" text-anchor="middle" class="pill">Analyzer</text>
    <rect x="470" width="106" height="36" rx="18" fill="#fff" stroke="#fdba74"/><text x="523" y="23" text-anchor="middle" class="pill">Reflection</text>
    <rect x="588" width="104" height="36" rx="18" fill="#fff" stroke="#fdba74"/><text x="640" y="23" text-anchor="middle" class="pill">Proposer</text>
  </g>
  <path d="M720 232v27" class="line"/>

  <rect x="54" y="260" width="1332" height="314" class="lane" fill="#eef4ff" stroke="#bfdbfe"/>
  <text x="80" y="296" class="lane-title">GEPASE Core · control and truth plane</text>
  <text x="80" y="319" class="lane-sub">The only owner of Package state, paired scoring, Graph views, Candidate lineage, budget accounting, Pareto state and Gate decisions.</text>

  <g transform="translate(83 352)">
    <g>
      <rect width="158" height="110" class="card"/>
      <circle cx="24" cy="24" r="13" fill="#f59e0b"/><text x="24" y="29" text-anchor="middle" class="number">1</text>
      <text x="20" y="58" class="card-title">Compile Package</text>
      <text x="20" y="80" class="card-sub">Snapshot · IR</text><text x="20" y="96" class="card-sub">static graph</text>
    </g>
    <path d="M159 55h27" class="line"/>
    <g transform="translate(187)">
      <rect width="158" height="110" class="card"/>
      <circle cx="24" cy="24" r="13" fill="#f59e0b"/><text x="24" y="29" text-anchor="middle" class="number">2</text>
      <text x="20" y="58" class="card-title">Freeze EvalPlan</text>
      <text x="20" y="80" class="card-sub">cases · split · rubric</text><text x="20" y="96" class="card-sub">host/model/seed</text>
    </g>
    <path d="M346 55h27" class="line"/>
    <g transform="translate(374)">
      <rect width="158" height="110" class="card"/>
      <circle cx="24" cy="24" r="13" fill="#3b82f6"/><text x="24" y="29" text-anchor="middle" class="number">3</text>
      <text x="20" y="58" class="card-title">Paired reference</text>
      <text x="20" y="80" class="card-sub">no-skill · original</text><text x="20" y="96" class="card-sub">E2 · E3 · grading</text>
    </g>
    <path d="M533 55h27" class="line"/>
    <g transform="translate(561)">
      <rect width="158" height="110" class="card"/>
      <circle cx="24" cy="24" r="13" fill="#8b5cf6"/><text x="24" y="29" text-anchor="middle" class="number">4</text>
      <text x="20" y="58" class="card-title">Graph + feedback</text>
      <text x="20" y="80" class="card-sub">static + observed</text><text x="20" y="96" class="card-sub">failure slice · ASI</text>
    </g>
    <path d="M720 55h27" class="line"/>
    <g transform="translate(748)">
      <rect width="158" height="110" class="card"/>
      <circle cx="24" cy="24" r="13" fill="#8b5cf6"/><text x="24" y="29" text-anchor="middle" class="number">5</text>
      <text x="20" y="58" class="card-title">Typed Patch</text>
      <text x="20" y="80" class="card-sub">bounded target set</text><text x="20" y="96" class="card-sub">atomic apply/rollback</text>
    </g>
    <path d="M907 55h27" class="line"/>
    <g transform="translate(935)">
      <rect width="158" height="110" class="card"/>
      <circle cx="24" cy="24" r="13" fill="#0ea5e9"/><text x="24" y="29" text-anchor="middle" class="number">6</text>
      <text x="20" y="58" class="card-title">Train Gate</text>
      <text x="20" y="80" class="card-sub">paired six-axis score</text><text x="20" y="96" class="card-sub">strict improvement</text>
    </g>
    <path d="M1094 55h27" class="line"/>
    <g transform="translate(1122)">
      <rect width="158" height="110" class="card"/>
      <circle cx="24" cy="24" r="13" fill="#10b981"/><text x="24" y="29" text-anchor="middle" class="number">7</text>
      <text x="20" y="58" class="card-title">Held-out Gate</text>
      <text x="20" y="80" class="card-sub">floors · relative cost</text><text x="20" y="96" class="card-sub">deployable frontier</text>
    </g>
  </g>

  <path d="M1096 488c0 56-72 61-236 61H850c-111 0-127-23-127-63v-21" class="loop"/>
  <rect x="600" y="512" width="520" height="39" rx="19.5" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="860" y="536" text-anchor="middle" class="pill">Reflection · Pareto · generation-2 · conditional same-package Merge</text>

  <path d="M720 574v28" class="line"/>
  <rect x="54" y="603" width="1332" height="77" class="lane" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="80" y="635" class="lane-title">Immutable evidence · provenance plane</text>
  <text x="80" y="659" class="lane-sub">WorkItem/submission · task-native output · transcript · package access · UsageRecord · Candidate seal · checkpoint · artifact index</text>
  <g transform="translate(1085 622)"><rect width="266" height="36" rx="18" fill="#fff" stroke="#6ee7b7"/><text x="133" y="23" text-anchor="middle" class="pill">append-only · hash-bound · resumable</text></g>
</svg>
